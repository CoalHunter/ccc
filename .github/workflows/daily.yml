name: Daily Coal Analysis

on:
  schedule:
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analyzer
        run: python analyzer.py

      - name: Show result summary
        run: |
          python -c "
          import json
          d = json.load(open('data/result.json'))
          print('Stocks:', len(d.get('stocks', [])))
          print('Errors:', d.get('errors', []))
          print('Stale:', d.get('stale', False))
          "

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/result.json
          git diff --staged --quiet || git commit -m "📊 Daily analysis $(date +%Y-%m-%d)"
          git push
